name: Build

on:
  push:
    branches:
      - '**'
      - '!main'
      - '!develop'

# 同じブランチへの連続 push では古い実行をキャンセルする
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: working
    runs-on: macos-latest

    env:
      PROJECT: Otanecho.xcodeproj
      SCHEME: Otanecho

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout
        uses: actions/checkout@v4

      - name: ci_post_clone
        run: |
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES

      - name: Generate Xcode project (XcodeGen)
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate

      # 依存の取得（SwiftLint・swift-syntax などの clone）に毎回 1 分以上かかるため、SourcePackages ごと保存する。
      # Package.resolved は .xcodeproj ごと生成物で git 管理外なので、依存を宣言している project.yml をキーにする
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/DerivedData/SourcePackages
          # restore-keys は付けない。依存が変わったときに古い依存入りのキャッシュを復元し、そのまま保存し直して肥大化するため
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}

      - name: Resolve package dependencies
        env:
          DERIVED_DATA: ${{ runner.temp }}/DerivedData
        run: .github/scripts/resolve_package_dependencies.sh

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData"
