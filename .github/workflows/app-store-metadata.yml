name: Metadata/App Store

# App Store の説明文・キーワード・サポート URL を App Store Connect に反映する。
#
# 元ネタは Localization/app-store-metadata/<言語>.json。欠損と文字数超過は
# Verify/localizations が PR の時点で落とすので、ここまで来たものは通る前提。
#
# 反映先は「編集できる状態のバージョン」だけ。審査中・配信済みのバージョンには触らない。
# スクリーンショットと違って撮影が要らないので数十秒で終わる。

on:
  workflow_dispatch:
    inputs:
      languages:
        description: '反映する言語（カンマ区切り）。空なら supported-languages.json の全言語'
        required: false
        default: ''
      app_version:
        description: '反映先のバージョン。空なら編集できるバージョンを自動で選ぶ'
        required: false
        default: ''
      missing_locales:
        description: 'App Store Connect にその言語が無いときの扱い'
        type: choice
        options:
          - create
          - skip
          - fail
        default: create
      dry_run:
        description: '書き込まず、やることだけ出す'
        type: boolean
        default: false

jobs:
  metadata:
    name: upload
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve bundle id
        # ビルドしないので project.yml から読む。ここに書き写すと二重管理になる。
        run: |
          set -euo pipefail
          bundle_id=$(python3 -c "
          import re, sys
          text = open('project.yml', encoding='utf-8').read()
          match = re.search(r'^\s*PRODUCT_BUNDLE_IDENTIFIER:\s*(\S+)\s*$', text, re.M)
          if not match:
              raise SystemExit('project.yml から PRODUCT_BUNDLE_IDENTIFIER が読めません')
          print(match.group(1))
          ")
          echo "BUNDLE_ID=$bundle_id" >> "$GITHUB_ENV"
          echo "bundle id: $bundle_id"

      - name: Verify metadata
        run: |
          set -euo pipefail
          python3 Tools/upload_metadata.py --check --languages "${{ inputs.languages }}"

      - name: Create Private Key
        run: |
          set -euo pipefail
          mkdir -p private_keys
          echo -n '${{ secrets.APPLE_API_KEY_BASE64 }}' | base64 --decode > private_keys/AuthKey.p8

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_PATH: private_keys/AuthKey.p8
          LANGUAGES: ${{ inputs.languages }}
          APP_VERSION: ${{ inputs.app_version }}
          MISSING_LOCALES: ${{ inputs.missing_locales }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # PyJWT は標準では入っていないので、この実行かぎりの venv に入れる
          python3 -m venv .venv
          .venv/bin/pip install --quiet --disable-pip-version-check pyjwt cryptography

          options=()
          if [ -n "$LANGUAGES" ]; then
            options+=(--languages "$LANGUAGES")
          fi
          if [ -n "$APP_VERSION" ]; then
            options+=(--app-version "$APP_VERSION")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            options+=(--dry-run)
          fi
          options+=(--missing-locales "$MISSING_LOCALES")

          # 空配列の展開は set -u だと未定義扱いになるので、空のときは何も渡さない書き方にする
          .venv/bin/python -u Tools/upload_metadata.py \
            --bundle-id "$BUNDLE_ID" \
            ${options[@]+"${options[@]}"} \
            | tee upload.log

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## App Store のメタデータ"
            echo
            echo "- 反映: $([ "${{ inputs.dry_run }}" = "true" ] && echo "しない（dry-run）" || echo "する")"
            echo
            if [ -f upload.log ]; then
              echo '```'
              cat upload.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
