name: Upload/develop

on:
  push:
    branches: develop

jobs:
  build:
    name: develop
    runs-on: macos-latest

    env:
      PROJECT: Otanecho.xcodeproj
      SCHEME: Otanecho

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout
        uses: actions/checkout@v4

      - name: ci_post_clone
        run: |
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES

      - name: Generate Xcode project (XcodeGen)
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate

      - name: Resolve package dependencies
        run: .github/scripts/resolve_package_dependencies.sh

      - name: Set Build Number
        run: |
          set -euo pipefail
          # CFBundleVersion は同じバージョン内で単調増加している必要があるため、UTC の日時から採番する。
          # 例: 20260920.2114（ワークフローをまたいでも重複せず、常に増加する）
          echo "BUILD_NUMBER=$(date -u +%Y%m%d).$(date -u +%H%M)" >> $GITHUB_ENV

      - name: Archive Project
        run: |
          set -euo pipefail
          xcodebuild archive -project "$PROJECT" \
                             -scheme "$SCHEME" \
                             -sdk iphoneos \
                             -configuration Release \
                             -archivePath build.xcarchive \
                             CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
                             CODE_SIGNING_ALLOWED=NO

      - name: Create ExportOptions.plist
        run: |
          set -euo pipefail
          echo '${{ secrets.EXPORT_OPTIONS }}' > ExportOptions.plist

      - name: Create Private Key
        run: |
          set -euo pipefail
          mkdir private_keys
          echo -n '${{ secrets.APPLE_API_KEY_BASE64 }}' | base64 --decode > ./private_keys/AuthKey_${{ secrets.APPLE_API_ISSUER_ID }}.p8

      - name: Export IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
                     -archivePath build.xcarchive \
                     -exportOptionsPlist ExportOptions.plist \
                     -exportPath app.ipa \
                     -allowProvisioningUpdates \
                     -authenticationKeyPath "$(pwd)/private_keys/AuthKey_${{ secrets.APPLE_API_ISSUER_ID }}.p8" \
                     -authenticationKeyID ${{ secrets.APPLE_API_KEY_ID }} \
                     -authenticationKeyIssuerID ${{ secrets.APPLE_API_ISSUER_ID }}

      - name: Upload IPA file to App Store Connect
        run: |
          set -euo pipefail
          # 書き出される ipa の名前はプロダクト名で、このプロジェクトではスキーム名と一致する
          xcrun altool --upload-app -f "app.ipa/$SCHEME.ipa" \
                       -u ${{ secrets.APPLE_ID }} \
                       -p ${{ secrets.APP_SPECIFIC_PASSWORD }} \
                       --type ios

      - name: Upload IPA file to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SCHEME }}.ipa
          path: app.ipa/${{ env.SCHEME }}.ipa
